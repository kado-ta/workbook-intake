name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (macOS-only tests are skipped)
        run: python3 -B -m unittest discover -s tests -t . -v
      - name: Shellcheck
        run: shellcheck hooks/*.sh scripts/*.sh dev/probe/workbook-intake/hooks/*.sh

  macos:
    runs-on: macos-latest
    env:
      # The hooks and doctor.sh require a python3 installed and owned by root, as the
      # Command Line Tools are. On the runner, xcode-select points to Xcode.app instead.
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests (sandbox-exec tests are required)
        run: WORKBOOK_INTAKE_REQUIRE_SANDBOX=1 "$(xcode-select -p)/usr/bin/python3" -B -m unittest discover -s tests -t . -v
